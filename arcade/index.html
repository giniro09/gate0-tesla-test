<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じゅうでんアーケード</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
:root {
  --bg: #0b0f1a;
  --card: #161c2c;
  --text: #f1f4fa;
  --muted: #8a93a8;
  --voice: #22c3a6;
  --face: #ff8a3d;
  --danger: #ef4444;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; touch-action: none; }
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: flex; }

/* Menu */
#menu { flex-direction: column; padding: 24px 28px; gap: 18px; overflow-y: auto; }
#menu header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
#menu h1 { font-size: 34px; letter-spacing: 0.04em; }
#menu h1 span { color: var(--voice); }
#menu h1 em { color: var(--face); font-style: normal; }
.sub { color: var(--muted); font-size: 16px; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.game-card {
  background: var(--card); border-radius: 20px; padding: 24px; border: 3px solid transparent;
  display: flex; flex-direction: column; gap: 10px; min-height: 220px; text-align: left; color: var(--text);
  font: inherit;
}
.game-card:active { transform: scale(0.98); }
.game-card.voice { border-color: var(--voice); }
.game-card.face { border-color: var(--face); }
.game-card .icon { font-size: 54px; line-height: 1; }
.game-card h2 { font-size: 28px; }
.game-card p { color: var(--muted); font-size: 17px; line-height: 1.5; }
.game-card .tag { margin-top: auto; font-size: 15px; font-weight: 700; }
.game-card.voice .tag { color: var(--voice); }
.game-card.face .tag { color: var(--face); }
.fame { background: var(--card); border-radius: 20px; padding: 18px 24px; }
.fame h3 { font-size: 20px; margin-bottom: 12px; }
.fame-list { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.fame-item { flex: 0 0 auto; width: 150px; text-align: center; font-size: 14px; color: var(--muted); }
.fame-item img, .fame-item .noimg { width: 150px; height: 112px; border-radius: 12px; object-fit: cover; background: #222a3d; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.fame-item b { display: block; color: var(--text); font-size: 20px; margin-top: 4px; }
.fame-empty { color: var(--muted); font-size: 16px; }
footer { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
footer a { color: var(--muted); }

/* Game */
#game { flex-direction: column; }
#stage { flex: 1; position: relative; overflow: hidden; }
#stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.35; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#hud { position: absolute; z-index: 2; top: 14px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; font-size: 26px; font-weight: 800; text-shadow: 0 2px 6px #000; }
#hud .right { display: flex; gap: 12px; align-items: center; }
#quit { pointer-events: auto; background: rgba(0,0,0,0.5); color: #fff; border: 2px solid #fff6; border-radius: 14px; font-size: 20px; padding: 10px 22px; min-height: 56px; }
#notice { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 12px; font-size: 17px; display: none; text-align: center; max-width: 90%; }
#overlay { position: absolute; z-index: 1; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(5,8,15,0.75); text-align: center; padding: 24px; }
#overlay.show { display: flex; }
#overlay h2 { font-size: 40px; }
#overlay p { font-size: 20px; color: #cfd6e4; line-height: 1.6; }
#overlay img { max-height: 46vh; max-width: 80vw; border-radius: 16px; border: 4px solid #fff; }
.btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.btn { font: inherit; font-size: 22px; font-weight: 700; border: none; border-radius: 16px; padding: 16px 34px; min-height: 68px; color: #0b0f1a; background: #fff; }
.btn.voice { background: var(--voice); }
.btn.face { background: var(--face); }
.btn.ghost { background: #2a3248; color: #fff; }

@media (max-width: 760px) {
  .games { grid-template-columns: 1fr; }
  #menu { padding: 16px; }
  #menu h1 { font-size: 26px; }
}
</style>
</head>
<body>

<section id="menu" class="screen active">
  <header>
    <h1><span>じゅうでん</span><em>アーケード</em></h1>
    <div class="sub">充電待ちの数分で遊べるミニゲーム</div>
  </header>
  <div class="games">
    <button class="game-card voice" data-game="voice">
      <div class="icon">🐤</div>
      <h2>こえでとべ！</h2>
      <p>声を出すとヒヨコが上昇。雲のすき間をくぐって、どこまで飛べるか挑戦しよう。</p>
      <div class="tag">🎤 マイクを使います（使えないときはタッチ長押し）</div>
    </button>
    <button class="game-card face" data-game="face">
      <div class="icon">😮</div>
      <h2>パクパクキャッチ</h2>
      <p>顔を動かして、落ちてくるフルーツを口を開けてパクッ。ピーマンは食べちゃダメ！ 60秒勝負。</p>
      <div class="tag">📷 カメラを使います（停車中のみ・使えないときはタッチ）</div>
    </button>
  </div>
  <div class="fame">
    <h3>🏆 殿堂入り</h3>
    <div class="fame-list" id="fame-list"></div>
  </div>
  <footer>
    <span id="env-note"></span>
    <a href="../cabin.html">診断ページ</a>
  </footer>
</section>

<section id="game" class="screen">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div id="hud-left"></div>
      <div class="right"><div id="hud-right"></div><button id="quit">やめる</button></div>
    </div>
    <div id="notice"></div>
    <div id="overlay"></div>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
